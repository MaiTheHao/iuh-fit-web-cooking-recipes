<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/auth-page.css" />
    <title>Recipe4f - Register</title>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <section class="auth-container">
          <div class="auth-card">
            <div class="auth-header">
              <h1 class="auth-title">Create Account</h1>
              <p class="auth-subtitle">Join our community of food enthusiasts and start saving your favorite recipes today.</p>
            </div>

            <form id="register-form" class="row g-3">
              <div class="col-12">
                <label for="fullName" class="form-label fw-medium small text-uppercase text-muted">Full Name</label>
                <input type="text" class="form-control form-control-auth" id="fullName" placeholder="e.g. Gordon Ramsay" required />
              </div>

              <div class="col-12">
                <label for="email" class="form-label fw-medium small text-uppercase text-muted">Email Address</label>
                <input type="text" class="form-control form-control-auth" id="email" placeholder="name@example.com" required />
              </div>

              <div class="col-md-6">
                <label for="password" class="form-label fw-medium small text-uppercase text-muted">Password</label>
                <input type="password" class="form-control form-control-auth" id="password" placeholder="••••••••" required />
              </div>

              <div class="col-md-6">
                <label for="confirmPassword" class="form-label fw-medium small text-uppercase text-muted">Confirm</label>
                <input type="password" class="form-control form-control-auth" id="confirmPassword" placeholder="••••••••" required />
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary w-100 py-2 fs-6">Sign Up</button>
              </div>
            </form>

            <div class="auth-footer">
              Already have an account?
              <a href="/pages/login.html">Sign In</a>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="modal fade" id="noti-modal" tabindex="-1" aria-labelledby="noti-modal__label" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="noti-modal__label">Notification</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-4">
            <p class="modal-message mb-0"></p>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/js/libs/bootstrap5/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/libs/lucide-icon/lucide.min.js"></script>
    <script src="../assets/js/utils/validator.js"></script>
    <script src="../assets/js/core/domains/base.domain.js"></script>
    <script src="../assets/js/core/domains/user.domain.js"></script>
    <script src="../assets/js/core/services/auth.service.js"></script>
    <script src="../assets/js/ui/components/notification.js"></script>
    <script src="../assets/js/ui/components/layout.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Khởi tạo các service cần thiết
        const auth = AuthService.getInstance();
        const notification = new Notification();

        // Nếu người dùng đã đăng nhập, chuyển hướng về trang chủ
        if (auth.isAuthenticated()) {
          window.location.href = '/pages/index.html';
          return;
        }

        const form = document.getElementById('register-form');

        if (form) {
          // Xử lý sự kiện khi gửi form đăng ký
          form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Thu thập dữ liệu từ các trường nhập liệu
            const formData = {
              fullName: document.getElementById('fullName').value.trim(),
              email: document.getElementById('email').value.trim(),
              password: document.getElementById('password').value,
              confirmPassword: document.getElementById('confirmPassword').value,
            };

            // Lớp kiểm tra dữ liệu đầu vào (Manual Validation Layer)
            // Kiểm tra họ và tên
            if (formData.fullName.length < 3 || formData.fullName.length > 100) {
              return notification.error('Invalid Name', 'Full name must be between 3 and 100 characters.');
            }

            // Kiểm tra email (độ dài và định dạng)
            if (formData.email.length < 5 || formData.email.length > 254) {
              return notification.error('Invalid Email', 'Email length must be between 5 and 254 characters.');
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
              return notification.error('Invalid Email', 'Please enter a valid email address.');
            }

            // Kiểm tra độ mạnh của mật khẩu
            if (formData.password.length < 8) {
              return notification.error('Invalid Password', 'Password must be at least 8 characters long.');
            }
            if (!/[a-zA-Z]/.test(formData.password)) {
              return notification.error('Invalid Password', 'Password must contain at least one letter.');
            }
            if (!/\d/.test(formData.password)) {
              return notification.error('Invalid Password', 'Password must contain at least one number.');
            }

            // Kiểm tra xem mật khẩu nhập lại có khớp không
            if (formData.password !== formData.confirmPassword) {
              return notification.error('Password Mismatch', 'Passwords do not match.');
            }

            // Gọi service để thực hiện đăng ký tài khoản mới
            const result = auth.register(formData);

            if (result.success) {
              notification.success('Account Created!', 'Registration successful.');
              setTimeout(() => (window.location.href = '/pages/login.html'), 1000);
            } else {
              // Hiển thị thông báo lỗi từ server nếu có
              const error = result.errors ? Object.values(result.errors)[0] : result.message;
              notification.error('Registration Failed', error);
            }
          });
        }

        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
