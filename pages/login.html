<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/auth-page.css" />
    <title>Recipe4f - Login</title>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <section class="auth-container">
          <div class="auth-card">
            <div class="auth-header">
              <h1 class="auth-title">Welcome Back</h1>
              <p class="auth-subtitle">
                Enter your credentials to access your personalized recipe collection.
              </p>
            </div>

            <form id="login-form" class="d-flex flex-column gap-3">
              <div>
                <label for="email" class="form-label fw-medium small text-uppercase text-muted"
                  >Email Address</label
                >
                <input
                  type="text"
                  class="form-control form-control-auth"
                  id="email"
                  placeholder="name@example.com"
                  required
                />
              </div>

              <div>
                <div class="mb-1">
                  <label
                    for="password"
                    class="form-label fw-medium small text-uppercase text-muted mb-0"
                    >Password</label
                  >
                </div>
                <input
                  type="password"
                  class="form-control form-control-auth"
                  id="password"
                  placeholder="••••••••"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fs-6 mt-2">Sign In</button>
            </form>

            <div class="auth-footer">
              Don't have an account?
              <a href="/pages/register.html">Create Account</a>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div
      class="modal fade"
      id="noti-modal"
      tabindex="-1"
      aria-labelledby="noti-modal__label"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="noti-modal__label">Notification</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body py-4">
            <p class="modal-message mb-0"></p>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/js/libs/bootstrap5/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/libs/lucide-icon/lucide.min.js"></script>

    <script src="../assets/js/utils/logger.js"></script>
    <script src="../assets/js/utils/validator.js"></script>
    <script src="../assets/js/core/config/localstorage.js"></script>

    <script src="../assets/js/core/domains/base.domain.js"></script>

    <script src="../assets/js/core/domains/user.domain.js"></script>

    <script src="../assets/js/core/services/auth.service.js"></script>

    <script src="../assets/js/ui/components/notification.js"></script>
    <script src="../assets/js/ui/components/layout.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const auth = AuthService.getInstance();
        const notification = new Notification();

        if (auth.isAuthenticated()) {
          window.location.href = '/pages/index.html';
          return;
        }

        const form = document.getElementById('login-form');

        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const result = auth.signin(email, password);

            if (result.success) {
              notification.success('Welcome back!', 'Login successful.');
              setTimeout(() => (window.location.href = '/pages/index.html'), 1000);
            } else {
              const error = result.errors ? Object.values(result.errors)[0] : result.message;
              notification.error('Login Failed', error);
            }
          });
        }

        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
