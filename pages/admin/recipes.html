<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Manage Recipes</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <style>
      .admin-page-header { padding: 40px 0; background: var(--surface-1); margin-bottom: 2rem; border-bottom: 1px solid var(--border); }
      .table-cover { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
      .table-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-right: 8px; }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <div class="admin-page-header text-center">
          <div class="container">
            <h1 class="display-5 fw-bold mb-3">Manage Recipes</h1>
            <p class="lead">Admin control panel for managing recipe entities.</p>
          </div>
        </div>

        <div class="container mb-5">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Recipes List</h3>
            <button class="btn btn-primary" id="btnCreateRecipe">
              <i data-lucide="plus" class="me-2"></i>Create Recipe
            </button>
          </div>

          <div class="table-responsive bg-white rounded shadow-sm p-3">
            <table class="table table-hover align-middle mb-0" id="recipesTable">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Cover</th>
                  <th>Code & Name</th>
                  <th>Cook Time</th>
                  <th>Author</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="recipesTableBody">
              </tbody>
            </table>
          </div>
        </div>

        <div class="modal fade" id="recipeModal" tabindex="-1">
          <div class="modal-dialog modal-xl">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="recipeModalTitle">Create Recipe</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="recipeForm">
                  <input type="hidden" id="recipeId" />
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Recipe Code</label>
                      <input type="text" class="form-control" id="recipeCode" required />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Recipe Name</label>
                      <input type="text" class="form-control" id="recipeName" required />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Description</label>
                      <textarea class="form-control" id="recipeDescription" rows="3" required></textarea>
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Image URL</label>
                      <input type="url" class="form-control" id="recipeImage" required />
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Prep Time (mins)</label>
                      <input type="number" class="form-control" id="recipePrepTime" required />
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Cook Time (mins)</label>
                      <input type="number" class="form-control" id="recipeCookTime" required />
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Category ID</label>
                      <input type="text" class="form-control" id="recipeCategoryId" required />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Author (User)</label>
                      <select class="form-select" id="recipeAuthorId" required>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Stars</label>
                      <input type="number" class="form-control" id="recipeStars" min="0" max="5" step="1" required />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Directions</label>
                      <textarea class="form-control" id="recipeDirections" rows="5" required></textarea>
                    </div>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="recipeForm" class="btn btn-primary" id="btnSaveRecipe">Save Recipe</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="noti-modal" tabindex="-1" aria-labelledby="noti-modal__label" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="noti-modal__label">Notification</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-4">
            <p class="modal-message mb-0"></p>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/js/libs/bootstrap5/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/libs/lucide-icon/lucide.min.js"></script>

    <script src="../../assets/js/utils/logger.js"></script>
    <script src="../../assets/js/utils/validator.js"></script>
    <script src="../../assets/js/core/config/localstorage.js"></script>

    <script src="../../assets/js/core/domains/base.domain.js"></script>

    <script src="../../assets/js/core/domains/category.domain.js"></script>
    <script src="../../assets/js/core/domains/user.domain.js"></script>
    <script src="../../assets/js/core/domains/recipe.domain.js"></script>

    <script src="../../assets/js/core/services/auth.service.js"></script>

    <script src="../../assets/js/ui/components/notification.js"></script>
    <script src="../../assets/js/ui/components/cards.js"></script>
    <script src="../../assets/js/ui/components/layout.js"></script>


    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const authService = AuthService.getInstance();

        if (!authService.isAdmin()) {
          window.location.href = '/pages/login.html';
          return;
        }

        const recipeRepo = RecipeRepository.getInstance();
        const userRepo = UserRepository.getInstance();
        const notification = new Notification();
        const usersMap = {};

        function loadUsers() {
          const users = userRepo.findAll();
          const selectEl = document.getElementById('recipeAuthorId');
          if (!selectEl) return;

          selectEl.innerHTML = '';
          users.forEach(user => {
            usersMap[user.id] = user;
            const opt = document.createElement('option');
            opt.value = user.id;
            opt.textContent = user.fullName;
            selectEl.appendChild(opt);
          });
        }

        function renderTable() {
          const tbody = document.getElementById('recipesTableBody');
          const recipes = recipeRepo.findAll();
          if (!tbody) return;

          if (recipes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No recipes found.</td></tr>';
            return;
          }

          tbody.innerHTML = recipes.map(recipe => {
            const author = usersMap[recipe.authorId];
            const authorHtml = author 
              ? `<div class="d-flex align-items-center"><img src="${author.avatar}" class="table-avatar" alt="Avatar"><span>${author.fullName}</span></div>`
              : '<span class="text-muted">Unknown</span>';

            return `
              <tr>
                <td><small class="text-muted">${recipe.id.substring(0, 8)}</small></td>
                <td><img src="${recipe.image}" class="table-cover" alt="Cover"></td>
                <td><div class="fw-bold">${recipe.name}</div><div class="text-muted small">${recipe.code}</div></td>
                <td>${recipe.cookTime ? recipe.cookTime + 'm' : '-'}</td>
                <td>${authorHtml}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-2 btn-edit" data-id="${recipe.id}"><i data-lucide="edit"></i> Edit</button>
                  <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${recipe.id}"><i data-lucide="trash"></i> Del</button>
                </td>
              </tr>
            `;
          }).join('');

          if (window.lucide) window.lucide.createIcons();
        }

        function openModal(id = null) {
          const form = document.getElementById('recipeForm');
          form.reset();

          document.getElementById('recipeId').value = id || '';
          document.getElementById('recipeModalTitle').textContent = id ? 'Edit Recipe' : 'Create Recipe';

          if (id) {
            const r = recipeRepo.findById(id);
            if (r) {
              document.getElementById('recipeCode').value = r.code;
              document.getElementById('recipeName').value = r.name;
              document.getElementById('recipeDescription').value = r.description;
              document.getElementById('recipeImage').value = r.image;
              document.getElementById('recipePrepTime').value = r.prepTime;
              document.getElementById('recipeCookTime').value = r.cookTime;
              document.getElementById('recipeCategoryId').value = r.categoryId;
              document.getElementById('recipeAuthorId').value = r.authorId;
              document.getElementById('recipeStars').value = r.stars;
              document.getElementById('recipeDirections').value = r.directions;
            }
          } else {
            const curr = authService.getCurrentUser();
            if (curr) document.getElementById('recipeAuthorId').value = curr.id;
          }
          new bootstrap.Modal(document.getElementById('recipeModal')).show();
        }

        function saveRecipe() {
          const form = document.getElementById('recipeForm');
          if (!form.checkValidity()) { form.reportValidity(); return; }

          try {
            const idInput = document.getElementById('recipeId').value;
            const id = idInput || crypto.randomUUID();
            const existing = idInput ? recipeRepo.findById(idInput) : null;
            
            const recipeData = new Recipe({
              id,
              code: document.getElementById('recipeCode').value,
              name: document.getElementById('recipeName').value,
              description: document.getElementById('recipeDescription').value,
              image: document.getElementById('recipeImage').value,
              prepTime: parseInt(document.getElementById('recipePrepTime').value) || 0,
              cookTime: parseInt(document.getElementById('recipeCookTime').value) || 0,
              categoryId: document.getElementById('recipeCategoryId').value,
              authorId: document.getElementById('recipeAuthorId').value,
              stars: parseInt(document.getElementById('recipeStars').value) || 0,
              directions: document.getElementById('recipeDirections').value,
              ingredients: existing ? existing.ingredients : [],
              nutrition: existing ? existing.nutrition : { calories: 0, protein: 0, carbs: 0, fat: 0, cholesterol: 0 }
            });

            if (recipeRepo.save(recipeData)) {
              bootstrap.Modal.getInstance(document.getElementById('recipeModal')).hide();
              renderTable();
              notification.success('Success', idInput ? 'Updated successfully' : 'Created successfully');
            }
          } catch (error) {
            notification.error('Error', error.message);
          }
        }

        loadUsers();
        renderTable();

        document.getElementById('btnCreateRecipe')?.addEventListener('click', () => openModal());

        document.getElementById('recipeForm')?.addEventListener('submit', (event) => {
          event.preventDefault();
          saveRecipe();
        });

        document.getElementById('recipesTableBody')?.addEventListener('click', (event) => {
          const editBtn = event.target.closest('.btn-edit');
          const delBtn = event.target.closest('.btn-delete');

          if (editBtn) openModal(editBtn.dataset.id);
          if (delBtn && confirm('Are you sure?')) {
            if (recipeRepo.delete(delBtn.dataset.id)) { renderTable(); notification.success('Success', 'Deleted'); }
          }
        });

        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
