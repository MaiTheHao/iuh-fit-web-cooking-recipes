<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Manage Blogs</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <style>
      .admin-page-header {
        padding: 40px 0;
        background: var(--surface-1);
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--border);
      }
      .table-cover {
        width: 80px;
        height: 50px;
        object-fit: cover;
        border-radius: 4px;
      }
      .table-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <div class="admin-page-header text-center">
          <div class="container">
            <h1 class="display-5 fw-bold mb-3">Manage Blogs</h1>
            <p class="lead">Admin control panel for managing blog post entities.</p>
          </div>
        </div>

        <div class="container mb-5">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Blogs List</h3>
            <button class="btn btn-primary" id="btnCreateBlog"><i data-lucide="plus" class="me-2"></i>Create Blog</button>
          </div>

          <div class="table-responsive bg-white rounded shadow-sm p-3">
            <table class="table table-hover align-middle mb-0" id="blogsTable">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Cover</th>
                  <th>Title</th>
                  <th>Published Date</th>
                  <th>Author</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="blogsTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="modal fade" id="blogModal" tabindex="-1">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="blogModalTitle">Create Blog</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="blogForm">
                  <input type="hidden" id="blogId" />
                  <div class="row g-3">
                    <div class="col-md-12">
                      <label class="form-label">Post Title</label>
                      <input type="text" class="form-control" id="blogTitle" required />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Excerpt</label>
                      <textarea class="form-control" id="blogExcerpt" rows="2" required></textarea>
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Cover Image URL</label>
                      <input type="url" class="form-control" id="blogImage" required />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Author (User)</label>
                      <select class="form-select" id="blogAuthorId" required></select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Tags (comma separated)</label>
                      <input type="text" class="form-control" id="blogTags" />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Content (Markdown/HTML)</label>
                      <textarea class="form-control" id="blogContent" rows="8" required></textarea>
                    </div>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="blogForm" class="btn btn-primary" id="btnSaveBlog">Save Blog</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="noti-modal" tabindex="-1" aria-labelledby="noti-modal__label" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="noti-modal__label">Notification</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-4">
            <p class="modal-message mb-0"></p>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/js/libs/bootstrap5/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/libs/lucide-icon/lucide.min.js"></script>

    <script src="../../assets/js/utils/validator.js"></script>

    <script src="../../assets/js/core/domains/base.domain.js"></script>

    <script src="../../assets/js/core/domains/blog.domain.js"></script>
    <script src="../../assets/js/core/domains/user.domain.js"></script>

    <script src="../../assets/js/core/services/auth.service.js"></script>

    <script src="../../assets/js/ui/components/notification.js"></script>
    <script src="../../assets/js/ui/components/cards.js"></script>
    <script src="../../assets/js/ui/components/layout.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const authService = AuthService.getInstance();

        if (!authService.isAdmin()) {
          window.location.href = '/pages/login.html';
          return;
        }

        const blogRepo = BlogPostRepository.getInstance();
        const userRepo = UserRepository.getInstance();
        const notification = new Notification();
        const usersMap = {};

        function loadUsers() {
          const users = userRepo.findAll();
          const selectEl = document.getElementById('blogAuthorId');
          if (!selectEl) return;

          selectEl.innerHTML = '';
          users.forEach((user) => {
            usersMap[user.id] = user;
            const opt = document.createElement('option');
            opt.value = user.id;
            opt.textContent = user.fullName;
            selectEl.appendChild(opt);
          });
        }

        function renderTable() {
          const tbody = document.getElementById('blogsTableBody');
          const blogs = blogRepo.findAll();
          if (!tbody) return;

          if (blogs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No blogs found.</td></tr>';
            return;
          }

          tbody.innerHTML = blogs
            .map((blog) => {
              const author = usersMap[blog.authorId];
              const authorHtml = author ? `<div class="d-flex align-items-center"><img src="${author.avatar}" class="table-avatar" alt="Avatar"><span>${author.fullName}</span></div>` : '<span class="text-muted">Unknown</span>';
              const dateStr = new Date(blog.publishedAt).toLocaleDateString();

              return `
              <tr>
                <td><small class="text-muted">${blog.id.substring(0, 8)}</small></td>
                <td><img src="${blog.image}" class="table-cover" alt="Cover"></td>
                <td><div class="fw-bold">${blog.title}</div></td>
                <td>${dateStr}</td>
                <td>${authorHtml}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-2 btn-edit" data-id="${blog.id}"><i data-lucide="edit"></i> Edit</button>
                  <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${blog.id}"><i data-lucide="trash"></i> Del</button>
                </td>
              </tr>
            `;
            })
            .join('');

          if (window.lucide) window.lucide.createIcons();
        }

        function openModal(id = null) {
          const form = document.getElementById('blogForm');
          form.reset();

          document.getElementById('blogId').value = id || '';
          document.getElementById('blogModalTitle').textContent = id ? 'Edit Blog' : 'Create Blog';

          if (id) {
            const b = blogRepo.findById(id);
            if (b) {
              document.getElementById('blogTitle').value = b.title;
              document.getElementById('blogExcerpt').value = b.excerpt;
              document.getElementById('blogImage').value = b.image;
              document.getElementById('blogAuthorId').value = b.authorId;
              document.getElementById('blogTags').value = (b.tags || []).join(', ');
              document.getElementById('blogContent').value = b.content;
            }
          } else {
            const curr = authService.getCurrentUser();
            if (curr) document.getElementById('blogAuthorId').value = curr.id;
          }
          new bootstrap.Modal(document.getElementById('blogModal')).show();
        }

        function saveBlog() {
          const form = document.getElementById('blogForm');
          if (!form.checkValidity()) {
            form.reportValidity();
            return;
          }

          try {
            const idInput = document.getElementById('blogId').value;
            const id = idInput || crypto.randomUUID();
            const existing = idInput ? blogRepo.findById(idInput) : null;

            const rawTags = document.getElementById('blogTags').value;
            const tags = rawTags
              ? rawTags
                  .split(',')
                  .map((tag) => tag.trim())
                  .filter(Boolean)
              : [];

            const blogData = new BlogPost({
              id,
              title: document.getElementById('blogTitle').value,
              excerpt: document.getElementById('blogExcerpt').value,
              content: document.getElementById('blogContent').value,
              image: document.getElementById('blogImage').value,
              authorId: document.getElementById('blogAuthorId').value,
              publishedAt: existing ? existing.publishedAt : new Date().toISOString(),
              tags: tags,
            });

            if (blogRepo.save(blogData)) {
              bootstrap.Modal.getInstance(document.getElementById('blogModal')).hide();
              renderTable();
              notification.success('Success', idInput ? 'Updated successfully' : 'Created successfully');
            }
          } catch (error) {
            notification.error('Error', error.message);
          }
        }

        loadUsers();
        renderTable();

        document.getElementById('btnCreateBlog')?.addEventListener('click', () => openModal());

        document.getElementById('blogForm')?.addEventListener('submit', (event) => {
          event.preventDefault();
          saveBlog();
        });

        document.getElementById('blogsTableBody')?.addEventListener('click', (event) => {
          const editBtn = event.target.closest('.btn-edit');
          const delBtn = event.target.closest('.btn-delete');

          if (editBtn) openModal(editBtn.dataset.id);
          if (delBtn && confirm('Are you sure?')) {
            if (blogRepo.delete(delBtn.dataset.id)) {
              renderTable();
              notification.success('Success', 'Deleted');
            }
          }
        });

        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
