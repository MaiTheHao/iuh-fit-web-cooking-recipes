<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Manage Users</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <style>
      .admin-page-header { padding: 40px 0; background: var(--surface-1); margin-bottom: 2rem; border-bottom: 1px solid var(--border); }
      .table-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <div class="admin-page-header text-center">
          <div class="container">
            <h1 class="display-5 fw-bold mb-3">Manage Users</h1>
            <p class="lead">Admin control panel for managing system users.</p>
          </div>
        </div>

        <div class="container mb-5">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Users List</h3>
            <button class="btn btn-primary" id="btnCreateUser">
              <i data-lucide="plus" class="me-2"></i>Create User
            </button>
          </div>

          <div class="table-responsive bg-white rounded shadow-sm p-3">
            <table class="table table-hover align-middle mb-0" id="usersTable">
              <thead class="table-light">
                <tr>
                  <th>ID / Avatar</th>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
              </tbody>
            </table>
          </div>
        </div>

        <div class="modal fade" id="userModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="userModalTitle">Create User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="userForm">
                  <input type="hidden" id="userId" />
                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="userEmail" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="userFullName" required />
                  </div>
                  <div class="mb-3" id="passwordGroup">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="userPassword" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" id="userRole" required>
                      <option value="user">User</option>
                      <option value="admin">Admin</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Avatar URL (Optional)</label>
                    <input type="url" class="form-control" id="userAvatar" />
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSaveUser">Save User</button>
              </div>
            </div>
          </div>
        </div>
        
        <div class="modal fade" id="resetPassModal" tabindex="-1">
          <div class="modal-dialog modal-sm">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Reset Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="resetPassForm">
                  <input type="hidden" id="resetPassUserId" />
                  <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" required />
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-primary w-100" id="btnSavePassword">Update Password</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="modal fade" id="noti-modal" tabindex="-1" aria-labelledby="noti-modal__label" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="noti-modal__label">Notification</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body py-4">
            <p class="modal-message mb-0"></p>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/js/libs/bootstrap5/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../assets/js/main.js"></script>
    <script src="../../assets/js/libs/lucide-icon/lucide.min.js"></script>
  </body>
</html>
