<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Manage Users</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <style>
      .admin-page-header {
        padding: 40px 0;
        background: var(--surface-1);
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--border);
      }
      .table-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <div class="admin-page-header text-center">
          <div class="container">
            <h1 class="display-5 fw-bold mb-3">Manage Users</h1>
            <p class="lead">Admin control panel for managing system users.</p>
          </div>
        </div>

        <div class="container mb-5">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Users List</h3>
            <button class="btn btn-primary" id="btnCreateUser">
              <i data-lucide="plus" class="me-2"></i>Create User
            </button>
          </div>

          <div class="table-responsive bg-white rounded shadow-sm p-3">
            <table class="table table-hover align-middle mb-0" id="usersTable">
              <thead class="table-light">
                <tr>
                  <th>ID / Avatar</th>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="modal fade" id="userModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="userModalTitle">Create User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="userForm">
                  <input type="hidden" id="userId" />
                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-control" id="userEmail" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="userFullName" required />
                  </div>
                  <div class="mb-3" id="passwordGroup">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="userPassword" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" id="userRole" required>
                      <option value="user">User</option>
                      <option value="admin">Admin</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Avatar URL (Optional)</label>
                    <input type="url" class="form-control" id="userAvatar" />
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                  Cancel
                </button>
                <button type="submit" form="userForm" class="btn btn-primary" id="btnSaveUser">
                  Save User
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="modal fade" id="resetPassModal" tabindex="-1">
          <div class="modal-dialog modal-sm">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Reset Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="resetPassForm">
                  <input type="hidden" id="resetPassUserId" />
                  <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" required />
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button
                  type="submit"
                  form="resetPassForm"
                  class="btn btn-primary w-100"
                  id="btnSavePassword"
                >
                  Update Password
                </button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div
      class="modal fade"
      id="noti-modal"
      tabindex="-1"
      aria-labelledby="noti-modal__label"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="noti-modal__label">Notification</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body py-4">
            <p class="modal-message mb-0"></p>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/js/libs/bootstrap5/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/libs/lucide-icon/lucide.min.js"></script>

    <script src="../../assets/js/utils/logger.js"></script>
    <script src="../../assets/js/utils/validator.js"></script>
    <script src="../../assets/js/core/config/localstorage.js"></script>

    <script src="../../assets/js/core/domains/base.domain.js"></script>

    <script src="../../assets/js/core/domains/user.domain.js"></script>

    <script src="../../assets/js/core/services/auth.service.js"></script>

    <script src="../../assets/js/ui/components/notification.js"></script>
    <script src="../../assets/js/ui/components/cards.js"></script>
    <script src="../../assets/js/ui/components/layout.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const authService = AuthService.getInstance();

        if (!authService.isAdmin()) {
          window.location.href = '/pages/login.html';
          return;
        }

        const userRepo = UserRepository.getInstance();
        const notification = new Notification();

        function renderTable() {
          const tbody = document.getElementById('usersTableBody');
          const users = userRepo.findAll();
          if (!tbody) return;

          if (users.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="5" class="text-center text-muted">No users found.</td></tr>';
            return;
          }

          tbody.innerHTML = users
            .map((user) => {
              const avatarHtml = `<img src="${user.avatar || 'https://via.placeholder.com/40'}" class="table-avatar me-2" alt="Avatar">`;
              const roleStr =
                user.role === 'admin'
                  ? '<span class="badge bg-danger">Admin</span>'
                  : '<span class="badge bg-secondary">User</span>';
              return `
              <tr>
                <td><div class="d-flex align-items-center">${avatarHtml}<small class="text-muted">${user.id.substring(0, 8)}</small></div></td>
                <td class="fw-bold">${user.fullName}</td>
                <td>${user.email}</td>
                <td>${roleStr}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-warning me-1 btn-repass" data-id="${user.id}" title="Reset Password"><i data-lucide="key"></i></button>
                  <button class="btn btn-sm btn-outline-primary me-1 btn-edit" data-id="${user.id}" title="Edit"><i data-lucide="edit"></i></button>
                  <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${user.id}" title="Delete"><i data-lucide="trash"></i></button>
                </td>
              </tr>
            `;
            })
            .join('');

          if (window.lucide) window.lucide.createIcons();
        }

        function openModal(id = null) {
          const form = document.getElementById('userForm');
          form.reset();

          document.getElementById('userId').value = id || '';
          document.getElementById('userModalTitle').textContent = id ? 'Edit User' : 'Create User';
          document.getElementById('userEmail').disabled = !!id;
          document.getElementById('passwordGroup').style.display = id ? 'none' : 'block';

          if (id) {
            const user = userRepo.findById(id);
            if (user) {
              document.getElementById('userEmail').value = user.email;
              document.getElementById('userFullName').value = user.fullName;
              document.getElementById('userRole').value = user.role;
              document.getElementById('userAvatar').value = user.avatar;
            }
          }
          new bootstrap.Modal(document.getElementById('userModal')).show();
        }

        function saveUser() {
          const form = document.getElementById('userForm');
          if (!form.checkValidity()) {
            form.reportValidity();
            return;
          }

          try {
            const idInput = document.getElementById('userId').value;
            const id = idInput || crypto.randomUUID();
            const email = document.getElementById('userEmail').value.trim();
            const fullName = document.getElementById('userFullName').value.trim();
            const role = document.getElementById('userRole').value;

            if (!idInput && userRepo.emailExists(email)) {
              notification.error('Error', 'Email already exists!');
              return;
            }

            const existing = idInput ? userRepo.findById(idInput) : null;
            const userData = new User({
              id,
              email,
              fullName,
              role,
              password: idInput ? existing.password : document.getElementById('userPassword').value,
              avatar:
                document.getElementById('userAvatar').value ||
                `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=random&size=256`,
              favoriteRecipes: existing ? existing.favoriteRecipes : [],
            });

            if (userRepo.save(userData)) {
              bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
              renderTable();
              notification.success(
                'Success',
                idInput ? 'Updated successfully' : 'Created successfully',
              );
            }
          } catch (error) {
            notification.error('Error', error.message);
          }
        }

        function openResetModal(id) {
          document.getElementById('resetPassForm').reset();
          document.getElementById('resetPassUserId').value = id;
          new bootstrap.Modal(document.getElementById('resetPassModal')).show();
        }

        function savePassword() {
          const id = document.getElementById('resetPassUserId').value;
          const newPass = document.getElementById('newPassword').value;
          const user = userRepo.findById(id);

          if (user) {
            user.password = newPass;
            if (userRepo.save(user)) {
              bootstrap.Modal.getInstance(document.getElementById('resetPassModal')).hide();
              notification.success('Success', 'Password updated');
            }
          }
        }

        renderTable();

        document.getElementById('btnCreateUser')?.addEventListener('click', () => openModal());

        document.getElementById('userForm')?.addEventListener('submit', (event) => {
          event.preventDefault();
          saveUser();
        });

        document.getElementById('resetPassForm')?.addEventListener('submit', (event) => {
          event.preventDefault();
          savePassword();
        });

        document.getElementById('usersTableBody')?.addEventListener('click', (event) => {
          const editBtn = event.target.closest('.btn-edit');
          const delBtn = event.target.closest('.btn-delete');
          const repassBtn = event.target.closest('.btn-repass');

          if (editBtn) openModal(editBtn.dataset.id);
          if (repassBtn) openResetModal(repassBtn.dataset.id);

          if (delBtn) {
            const curr = authService.getCurrentUser();
            if (curr && curr.id === delBtn.dataset.id) {
              notification.error('Error', 'You cannot delete yourself!');
              return;
            }
            if (confirm('Are you sure?')) {
              if (userRepo.delete(delBtn.dataset.id)) {
                renderTable();
                notification.success('Success', 'Deleted');
              }
            }
          }
        });

        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
