<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Manage Blogs</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      .admin-page-header {
        padding: 40px 0;
        background: var(--surface-1);
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--border);
      }
      .table-cover {
        width: 80px;
        height: 50px;
        object-fit: cover;
        border-radius: 4px;
      }
      .table-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <div class="admin-page-header text-center">
          <div class="container">
            <h1 class="display-5 fw-bold mb-3">Manage Blogs</h1>
            <p class="lead">Admin control panel for managing blog post entities.</p>
          </div>
        </div>

        <div class="container mb-5">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Blogs List</h3>
            <button class="btn btn-primary" id="btnCreateBlog"><i data-lucide="plus" class="me-2"></i>Create Blog</button>
          </div>

          <div class="table-responsive bg-white rounded shadow-sm p-3">
            <table class="table table-hover align-middle mb-0" id="blogsTable">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Cover</th>
                  <th>Title</th>
                  <th>Published Date</th>
                  <th>Author</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="blogsTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="modal fade" id="blogModal" tabindex="-1">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="blogModalTitle">Create Blog</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="blogForm">
                  <input type="hidden" id="blogId" />
                  <div class="row g-3">
                    <div class="col-md-12">
                      <label class="form-label">Post Title</label>
                      <input type="text" class="form-control" id="blogTitle" />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Excerpt</label>
                      <textarea class="form-control" id="blogExcerpt" rows="2"></textarea>
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Cover Image URL</label>
                      <input type="url" class="form-control" id="blogImage" />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Author (User)</label>
                      <select class="form-select" id="blogAuthorId"></select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Tags (comma separated)</label>
                      <input type="text" class="form-control" id="blogTags" />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Content (Markdown/HTML)</label>
                      <textarea class="form-control" id="blogContent" rows="8"></textarea>
                    </div>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="blogForm" class="btn btn-primary" id="btnSaveBlog">Save Blog</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/lucide.min.js"></script>
    <script src="../js/init.js"></script>

    <script>
      // Khởi chạy khi DOM sẵn sàng
      document.addEventListener('DOMContentLoaded', () => {
        // Kiểm tra quyền Admin
        const currentUserId = localStorage.getItem('CURRENT_USER_ID');
        const users = JSON.parse(localStorage.getItem('USERS') || '[]');
        const currentUser = users.find((u) => u.id === currentUserId);

        if (!currentUser || currentUser.role !== 'admin') {
          window.location.href = '/pages/login.html';
          return;
        }

        // Lưu trữ danh sách users để map tên tác giả
        let usersMap = {};

        // Tải danh sách tác giả vào select box
        function loadUsers() {
          const users = JSON.parse(localStorage.getItem('USERS') || '[]');
          const selectEl = document.getElementById('blogAuthorId');
          if (!selectEl) return;

          selectEl.innerHTML = '';
          users.forEach((user) => {
            usersMap[user.id] = user;
            const opt = document.createElement('option');
            opt.value = user.id;
            opt.textContent = user.fullName;
            selectEl.appendChild(opt);
          });
        }

        // Render bảng danh sách bài viết
        function renderTable() {
          const tbody = document.getElementById('blogsTableBody');
          const blogs = JSON.parse(localStorage.getItem('BLOGS') || '[]');
          if (!tbody) return;

          if (blogs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No blogs found.</td></tr>';
            return;
          }

          tbody.innerHTML = blogs
            .map((blog) => {
              const author = usersMap[blog.authorId];
              const authorHtml = author ? `<div class="d-flex align-items-center"><img src="${author.avatar}" class="table-avatar" alt="Avatar"><span>${author.fullName}</span></div>` : '<span class="text-muted">Unknown</span>';
              const dateStr = new Date(blog.publishedAt).toLocaleDateString();

              return `
              <tr>
                <td><small class="text-muted">${blog.id.substring(0, 8)}</small></td>
                <td><img src="${blog.image}" class="table-cover" alt="Cover"></td>
                <td><div class="fw-bold">${blog.title}</div></td>
                <td>${dateStr}</td>
                <td>${authorHtml}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-2 btn-edit" data-id="${blog.id}"><i data-lucide="edit"></i> Edit</button>
                  <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${blog.id}"><i data-lucide="trash"></i> Del</button>
                </td>
              </tr>
            `;
            })
            .join('');

          if (window.lucide) window.lucide.createIcons();
        }

        // Mở modal Thêm/Sửa bài viết
        function openModal(id = null) {
          const form = document.getElementById('blogForm');
          form.reset();

          document.getElementById('blogId').value = id || '';
          document.getElementById('blogModalTitle').textContent = id ? 'Edit Blog' : 'Create Blog';

          if (id) {
            const blogs = JSON.parse(localStorage.getItem('BLOGS') || '[]');
            const b = blogs.find((blog) => blog.id === id);
            if (b) {
              document.getElementById('blogTitle').value = b.title;
              document.getElementById('blogExcerpt').value = b.excerpt;
              document.getElementById('blogImage').value = b.image;
              document.getElementById('blogAuthorId').value = b.authorId;
              document.getElementById('blogTags').value = (b.tags || []).join(', ');
              document.getElementById('blogContent').value = b.content;
            }
          } else {
            if (currentUser) document.getElementById('blogAuthorId').value = currentUser.id;
          }
          new bootstrap.Modal(document.getElementById('blogModal')).show();
        }

        // Lưu thông tin bài viết vào LocalStorage
        function saveBlog() {
          try {
            const idInput = document.getElementById('blogId').value;
            const id = idInput || crypto.randomUUID();

            const title = document.getElementById('blogTitle').value.trim();
            const excerpt = document.getElementById('blogExcerpt').value.trim();
            const image = document.getElementById('blogImage').value.trim();
            const authorId = document.getElementById('blogAuthorId').value;
            const content = document.getElementById('blogContent').value.trim();

            // Kiểm tra các trường bắt buộc
            if (!title) return notification.error('Missing Title', 'Please enter a blog title.');
            if (!excerpt) return notification.error('Missing Excerpt', 'Please enter an excerpt.');
            if (!image) return notification.error('Missing Image', 'Please enter an image URL.');
            if (!authorId) return notification.error('Missing Author', 'Please select an author.');
            if (!content) return notification.error('Missing Content', 'Please enter blog content.');

            const blogs = JSON.parse(localStorage.getItem('BLOGS') || '[]');
            const existingIndex = idInput ? blogs.findIndex((b) => b.id === idInput) : -1;
            const existing = existingIndex > -1 ? blogs[existingIndex] : null;

            const rawTags = document.getElementById('blogTags').value;
            const tags = rawTags
              ? rawTags
                  .split(',')
                  .map((tag) => tag.trim())
                  .filter(Boolean)
              : [];

            if (title.length < 5) {
              return notification.error('Invalid Title', 'Title must be at least 5 characters long.');
            }

            const blogData = {
              id,
              title: title,
              excerpt: excerpt,
              content: content,
              image: image,
              authorId: authorId,
              publishedAt: existing ? existing.publishedAt : new Date().toISOString(),
              tags: tags,
            };

            // Cập nhật hoặc thêm mới bài viết
            if (existingIndex > -1) {
              blogs[existingIndex] = blogData;
            } else {
              blogs.push(blogData);
            }

            localStorage.setItem('BLOGS', JSON.stringify(blogs));

            bootstrap.Modal.getInstance(document.getElementById('blogModal')).hide();
            renderTable();
            notification.success('Success', idInput ? 'Updated successfully' : 'Created successfully');
          } catch (error) {
            notification.error('Error', error.message);
          }
        }

        // Khởi tạo giao diện ban đầu
        loadUsers();
        renderTable();

        // Bắt sự kiện tạo mới bài viết
        document.getElementById('btnCreateBlog')?.addEventListener('click', () => openModal());

        // Bắt sự kiện submit form lưu bài
        document.getElementById('blogForm')?.addEventListener('submit', (event) => {
          event.preventDefault();
          saveBlog();
        });

        // Bắt sự kiện click Sửa/Xóa trên bảng
        document.getElementById('blogsTableBody')?.addEventListener('click', (event) => {
          const editBtn = event.target.closest('.btn-edit');
          const delBtn = event.target.closest('.btn-delete');

          // Mở modal nếu bấm Edit
          if (editBtn) openModal(editBtn.dataset.id);

          // Xóa bài nếu bấm Delete
          if (delBtn && confirm('Are you sure you want to delete this blog?')) {
            const blogs = JSON.parse(localStorage.getItem('BLOGS') || '[]');
            const id = delBtn.dataset.id;
            const index = blogs.findIndex((b) => b.id === id);
            if (index > -1) {
              blogs.splice(index, 1);
              localStorage.setItem('BLOGS', JSON.stringify(blogs));
              renderTable();
              notification.success('Success', 'Deleted successfully');
            }
          }
        });

        // Khởi tạo các biểu tượng Lucide
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
