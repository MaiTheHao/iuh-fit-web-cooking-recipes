<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pages/blogs.css" />
    <link rel="stylesheet" href="../css/layout/header.css" />
    <link rel="stylesheet" href="../css/layout/footer.css" />
    <title>Recipe4f - Blog Detail</title>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <section class="container mt-4 mb-5">
          <div class="blog-detail-card p-0 overflow-hidden">
            <div class="row g-0">
              <div class="col-lg-6 p-4 p-md-5 d-flex flex-column justify-content-center">
                <div class="d-flex align-items-center gap-2 mb-3">
                  <span class="badge bg-accent bg-opacity-10 text-accent">Story</span>
                  <div id="blog-read-time" class="d-flex gap-1 text-muted small"></div>
                </div>

                <h1 id="blog-title" class="display-5 fw-bold ff-serif mb-3 text-primary"></h1>
                <p id="blog-excerpt" class="text-secondary mb-4"></p>

                <div class="blog-meta-bar d-flex flex-wrap align-items-center gap-4 py-3 border-top w-100" style="border-color: var(--color-border) !important">
                  <div id="blog-author" class="d-flex align-items-center gap-2">
                    <img id="author-avatar" src="" class="rounded-circle" width="40" height="40" alt="Author" style="object-fit: cover" />
                    <div class="d-flex flex-column" style="line-height: 1.2">
                      <span class="small text-muted text-uppercase" style="font-size: 0.7rem">Written by</span>
                      <span id="author-name" class="fw-bold text-dark"></span>
                    </div>
                  </div>

                  <div class="vr mx-2 text-muted d-none d-md-block opacity-25"></div>

                  <div id="blog-meta-data" class="d-flex gap-4 text-secondary">
                    <div class="d-flex align-items-center gap-2" title="Published Date">
                      <i data-lucide="calendar" width="18"></i>
                      <span id="publish-date"></span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-lg-6 bg-light d-flex align-items-stretch">
                <img id="blog-image" src="" alt="Blog Cover" class="w-100 h-100 object-fit-cover" />
              </div>
            </div>
          </div>
        </section>

        <section class="container pb-5">
          <div class="row g-4">
            <div class="col-lg-8 order-1">
              <div class="blog-detail-card p-4 p-md-5">
                <article id="blog-content" class="blog-content markdown-content"></article>
              </div>
            </div>

            <div class="col-lg-4 order-2">
              <div class="sidebar-sticky d-flex flex-column gap-4">
                <div class="blog-detail-card p-4">
                  <h3 class="ff-serif mb-4 d-flex align-items-center gap-2 text-primary h4">
                    <i data-lucide="tag" class="text-accent"></i>
                    Tags
                  </h3>
                  <div id="blog-tags" class="d-flex flex-wrap gap-2"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="container pb-5">
          <div class="container">
            <h3 class="ff-serif text-center mb-4">You Might Also Like</h3>
            <div id="related-blogs" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/lucide.min.js"></script>
    <script src="../js/marked.min.js"></script>
    <script src="../js/init.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('id');

        // Báo lỗi nếu thiếu ID bài viết
        if (!blogId) return (window.location.href = '/pages/notfound.html');

        // Đọc dữ liệu từ LocalStorage
        const blogs = JSON.parse(localStorage.getItem('BLOGS') || '[]');
        const users = JSON.parse(localStorage.getItem('USERS') || '[]');

        // Tìm bài viết theo ID
        const blog = blogs.find((b) => b.id === blogId);
        if (!blog) return (window.location.href = '/pages/notfound.html');

        // Cập nhật tiêu đề trang và thông tin text
        document.title = `${blog.title} - Recipe4f`;
        document.getElementById('blog-title').textContent = blog.title;
        document.getElementById('blog-excerpt').textContent = blog.excerpt;

        // Cập nhật ảnh đại diện bài viết
        document.getElementById('blog-image').src = blog.image;

        // Hiển thị thông tin tác giả
        const author = users.find((u) => u.id === blog.authorId);
        const authorName = author.fullName;
        const authorAvatar = author.avatar;
        document.getElementById('author-avatar').src = authorAvatar;
        document.getElementById('author-name').textContent = authorName;

        // Định dạng ngày đăng bài
        const publishDate = new Date(blog.publishedAt).toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
        });
        document.getElementById('publish-date').textContent = publishDate;

        // Tính toán thời gian đọc dựa trên số từ
        const words = blog.content.split(/\s+/).length;
        const readTime = Math.ceil(words / 200);
        document.getElementById('blog-read-time').innerHTML = `<i data-lucide="clock" width="14"></i><span>${readTime} min read</span>`;

        // Hiển thị nội dung bài viết
        document.getElementById('blog-content').innerHTML = marked.parse(blog.content);

        // Hiển thị danh sách thẻ
        document.getElementById('blog-tags').innerHTML = blog.tags.map((tag) => `<span class="badge bg-light text-dark border p-2 fw-normal">${tag}</span>`).join('');

        // Hiển thị các bài viết liên quan theo Tag, giới hạn 3 bài
        const related = blogs.filter((b) => b.id !== blog.id && b.tags.some((t) => blog.tags.includes(t))).slice(0, 3);
        if (related.length > 0 && window.BlogList) window.BlogList.render('related-blogs', related);

        // Khởi tạo các icon Lucide
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
