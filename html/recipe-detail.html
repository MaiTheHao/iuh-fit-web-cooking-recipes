<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/recipe-detail.css" />
    <title>Recipe4f - Recipe Detail</title>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <section class="container mt-4 mb-5">
          <div class="recipe-detail-card p-0 overflow-hidden">
            <div class="row g-0">
              <div class="col-lg-6 p-4 p-md-5 d-flex flex-column justify-content-center">
                <div class="d-flex align-items-center gap-2 mb-3">
                  <span id="recipe-category" class="badge bg-accent bg-opacity-10 text-accent"></span>
                  <div id="recipe-stars" class="d-flex gap-1 text-warning small"></div>
                </div>

                <h1 id="recipe-title" class="display-5 fw-bold ff-serif mb-3 text-primary"></h1>
                <p id="recipe-description" class="text-secondary mb-4"></p>

                <div class="recipe-meta-bar d-flex flex-wrap align-items-center gap-4 py-3 border-top w-100">
                  <div id="recipe-author" class="d-flex align-items-center gap-2">
                    <img id="author-avatar" src="" class="rounded-circle" width="40" height="40" alt="Author" style="object-fit: cover" />
                    <div class="d-flex flex-column" style="line-height: 1.2">
                      <span class="small text-muted text-uppercase" style="font-size: 0.7rem">Created by</span>
                      <span id="author-name" class="fw-bold text-dark"></span>
                    </div>
                  </div>

                  <div class="vr mx-2 text-muted d-none d-md-block opacity-25"></div>

                  <div id="recipe-meta-data" class="d-flex gap-4 text-secondary grow">
                    <div class="d-flex align-items-center gap-2" title="Prep Time"><i data-lucide="clock" width="18"></i><span id="prep-time"></span></div>
                    <div class="d-flex align-items-center gap-2" title="Cook Time"><i data-lucide="flame" width="18"></i><span id="cook-time"></span></div>
                    <button class="btn btn-outline-danger btn-sm rounded-pill ms-auto btn-fav" id="btn-favorite-recipe" style="display: flex; align-items: center; gap: 0.5ch">
                      <i data-lucide="heart" width="18" id="fav-icon"></i>
                      <span id="fav-text">Let's Favorite</span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="col-lg-6 bg-light d-flex align-items-stretch">
                <img id="recipe-image" src="" alt="Recipe Cover" class="w-100 h-100 object-fit-cover" />
              </div>
            </div>
          </div>
        </section>

        <section class="container pb-5">
          <div class="row g-4 markdown-content">
            <div class="col-lg-4 order-2 order-lg-1">
              <div class="sidebar-sticky d-flex flex-column gap-4">
                <div class="recipe-detail-card p-4">
                  <h3 class="ff-serif mb-4 d-flex align-items-center gap-2 text-primary h4">
                    <i data-lucide="shopping-basket" class="text-accent"></i>
                    Ingredients
                  </h3>
                  <div id="recipe-ingredients" class="ingredients-list"></div>
                </div>

                <div class="recipe-detail-card p-4">
                  <h3 class="ff-serif mb-4 d-flex align-items-center gap-2 text-primary h4">
                    <i data-lucide="activity" class="text-accent"></i>
                    Nutrition
                  </h3>
                  <div id="recipe-nutrition" class="nutrition-list">
                    <div class="nutrition-item">
                      <div class="d-flex align-items-center">
                        <i data-lucide="flame" class="nutrition-icon" width="18"></i>
                        <span class="nutrition-label">Calories</span>
                      </div>
                      <span class="nutrition-value"><span id="nut-calories"></span><small>kcal</small></span>
                    </div>
                    <div class="nutrition-item">
                      <div class="d-flex align-items-center">
                        <i data-lucide="drumstick" class="nutrition-icon" width="18"></i>
                        <span class="nutrition-label">Protein</span>
                      </div>
                      <span class="nutrition-value"><span id="nut-protein"></span><small>g</small></span>
                    </div>
                    <div class="nutrition-item">
                      <div class="d-flex align-items-center">
                        <i data-lucide="droplet" class="nutrition-icon" width="18"></i>
                        <span class="nutrition-label">Fat</span>
                      </div>
                      <span class="nutrition-value"><span id="nut-fat"></span><small>g</small></span>
                    </div>
                    <div class="nutrition-item">
                      <div class="d-flex align-items-center">
                        <i data-lucide="wheat" class="nutrition-icon" width="18"></i>
                        <span class="nutrition-label">Carbs</span>
                      </div>
                      <span class="nutrition-value"><span id="nut-carbs"></span><small>g</small></span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-lg-8 order-1 order-lg-2">
              <div class="recipe-detail-card p-4 p-md-5">
                <div class="d-flex align-items-center gap-2 mb-5 pb-3 border-bottom">
                  <span class="step-number-icon"><i data-lucide="chef-hat"></i></span>
                  <h2 class="ff-serif m-0 text-primary">Instructions</h2>
                </div>

                <div id="recipe-directions" class="timeline-steps"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="container pb-5">
          <div class="container">
            <h3 class="ff-serif text-center mb-4">You Might Also Like</h3>
            <div id="related-recipes" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/lucide.min.js"></script>
    <script src="../js/marked.min.js"></script>
    <script src="../js/init.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const recipeCode = urlParams.get('code');

        // Báo lỗi nếu thiếu mã công thức
        if (!recipeCode) return (window.location.href = '/pages/notfound.html');

        // Đọc dữ liệu từ LocalStorage
        const recipes = JSON.parse(localStorage.getItem('RECIPES') || '[]');
        const categories = JSON.parse(localStorage.getItem('CATEGORIES') || '[]');
        const users = JSON.parse(localStorage.getItem('USERS') || '[]');
        const currentUserId = localStorage.getItem('CURRENT_USER_ID');
        const currentUser = users.find((u) => u.id === currentUserId);

        // Tìm công thức theo mã code
        const recipe = recipes.find((r) => r.code === recipeCode);
        if (!recipe) return (window.location.href = '/pages/notfound.html');

        // Cập nhật tiêu đề trang và nội dung text
        document.title = recipe.name;
        document.getElementById('recipe-title').textContent = recipe.name;
        document.getElementById('recipe-description').textContent = recipe.description;

        // Cập nhật ảnh đại diện món ăn
        document.getElementById('recipe-image').src = recipe.image;

        // Hiển thị tên danh mục
        const category = categories.find((c) => c.id === recipe.categoryId);
        document.getElementById('recipe-category').textContent = category.name;

        // Hiển thị số sao đánh giá
        renderStarsUI(recipe.stars);

        // Hiển thị thông tin tác giả
        const author = users.find((u) => u.id === recipe.authorId);
        document.getElementById('author-name').textContent = author.fullName;
        document.getElementById('author-avatar').src = author.avatar;

        // Hiển thị thời gian và trạng thái yêu thích
        const isFavorite = currentUser?.favoriteRecipes?.includes(recipe.id);
        document.getElementById('prep-time').textContent = `${recipe.prepTime} min`;
        document.getElementById('cook-time').textContent = `${recipe.cookTime} min`;

        const favBtn = document.getElementById('btn-favorite-recipe');
        const favIcon = document.getElementById('fav-icon');
        const favText = document.getElementById('fav-text');

        if (isFavorite) {
          favBtn.classList.add('favorited');
          favText.textContent = 'Favorited';
        }

        // Hiển thị danh sách nguyên liệu
        let ingHtml = '';
        recipe.ingredients.forEach((group, groupIndex) => {
          ingHtml += `<h5 class="ingredient-group-title">${group.section}</h5>`;
          group.items.forEach((item, itemIndex) => {
            const id = `ing-${groupIndex}-${itemIndex}`;
            ingHtml += `
              <label class="ingredient-label" for="${id}">
                <input type="checkbox" id="${id}" class="ingredient-checkbox">
                <span class="ingredient-text"><strong class="text-dark">${item.quantity}</strong> <span>${item.name}</span></span>
              </label>
            `;
          });
        });
        document.getElementById('recipe-ingredients').innerHTML = ingHtml;

        // Hiển thị hướng dẫn thực hiện
        if (recipe.directions) {
          // Hiển thị đơn giản
          // document.getElementById('recipe-directions').innerHTML = marked.parse(recipe.directions);

          // Hiển thị custom
          document.getElementById('recipe-directions').innerHTML = recipe.directions
            .split('###')
            .filter(Boolean)
            .map((chunk, i) => {
              const [title, ...content] = chunk.trim().split('\n');
              return `
                  <div class="step-card">
                    <div class="step-header">
                      <div class="step-number">${i + 1}</div>
                      <h3 class="step-title">${title.trim()}</h3>
                    </div>
                    <div class="step-content">${marked.parse(content.join('\n').trim())}</div>
                  </div>`;
            })
            .join('');
        }

        // Hiển thị thông tin dinh dưỡng
        const nut = recipe.nutrition;
        document.getElementById('nut-calories').textContent = nut.calories || '-';
        document.getElementById('nut-protein').textContent = nut.protein || '-';
        document.getElementById('nut-fat').textContent = nut.fat || '-';
        document.getElementById('nut-carbs').textContent = nut.carbs || '-';

        // Hiển thị các món ăn liên quan, giới hạn 3 món
        const related = recipes.filter((r) => r.categoryId === recipe.categoryId && r.id !== recipe.id).slice(0, 3);
        RecipeList.render('related-recipes', related);

        // Xử lý sự kiện checkbox nguyên liệu
        document.getElementById('recipe-ingredients').addEventListener('change', (e) => {
          if (e.target.classList.contains('ingredient-checkbox')) {
            e.target.closest('.ingredient-label').classList.toggle('checked', e.target.checked);
          }
        });

        // Xử lý sự kiện nhấn nút yêu thích
        favBtn?.addEventListener('click', () => {
          if (!currentUser) return notification.warn('Require Login', 'Please login to save favorite recipes');

          if (!currentUser.favoriteRecipes) currentUser.favoriteRecipes = [];
          const index = currentUser.favoriteRecipes.indexOf(recipe.id);

          // Trạng thái sau khi bấm (Nếu chưa có thì là Đang Thêm, nếu có rồi thì là Đang Hủy)
          const willBeFavorited = index === -1;

          if (willBeFavorited) {
            currentUser.favoriteRecipes.push(recipe.id);
          } else {
            currentUser.favoriteRecipes.splice(index, 1);
          }

          // Lưu lại
          localStorage.setItem('USERS', JSON.stringify(users));

          // Cập nhật giao diện đồng bộ
          favBtn.classList.toggle('favorited', willBeFavorited);
          favText.textContent = willBeFavorited ? 'Favorited' : "Let's Favorite";
        });

        // Khởi tạo các icon Lucide
        if (window.lucide) window.lucide.createIcons();

        function renderStarsUI(count) {
          const element = document.getElementById('recipe-stars');
          let html = '';
          for (let i = 0; i < 5; i++) {
            const fill = i < count ? 'fill-current' : 'text-muted opacity-25';
            html += `<i data-lucide="star" class="${fill}" width="16" height="16"></i>`;
          }
          html += `<span class="text-muted ms-1">(${count}/5)</span>`;
          element.innerHTML = html;
        }
      });
    </script>
  </body>
</html>
