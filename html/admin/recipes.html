<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Manage Recipes</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <style>
      .admin-page-header {
        padding: 40px 0;
        background: var(--surface-1);
        margin-bottom: 2rem;
        border-bottom: 1px solid var(--border);
      }
      .table-cover {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 8px;
      }
      .table-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <div class="admin-page-header text-center">
          <div class="container">
            <h1 class="display-5 fw-bold mb-3">Manage Recipes</h1>
            <p class="lead">Admin control panel for managing recipe entities.</p>
          </div>
        </div>

        <div class="container mb-5">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Recipes List</h3>
            <button class="btn btn-primary" id="btnCreateRecipe"><i data-lucide="plus" class="me-2"></i>Create Recipe</button>
          </div>

          <div class="table-responsive bg-white rounded shadow-sm p-3">
            <table class="table table-hover align-middle mb-0" id="recipesTable">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Cover</th>
                  <th>Code & Name</th>
                  <th>Cook Time</th>
                  <th>Author</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="recipesTableBody"></tbody>
            </table>
          </div>
        </div>

        <div class="modal fade" id="recipeModal" tabindex="-1">
          <div class="modal-dialog modal-xl">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="recipeModalTitle">Create Recipe</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form id="recipeForm">
                  <input type="hidden" id="recipeId" />
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label">Recipe Code</label>
                      <input type="text" class="form-control" id="recipeCode" />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Recipe Name</label>
                      <input type="text" class="form-control" id="recipeName" />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Description</label>
                      <textarea class="form-control" id="recipeDescription" rows="3"></textarea>
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Image URL</label>
                      <input type="url" class="form-control" id="recipeImage" />
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Prep Time (mins)</label>
                      <input type="number" class="form-control" id="recipePrepTime" />
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Cook Time (mins)</label>
                      <input type="number" class="form-control" id="recipeCookTime" />
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">Category ID</label>
                      <input type="text" class="form-control" id="recipeCategoryId" />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Author (User)</label>
                      <select class="form-select" id="recipeAuthorId"></select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label">Stars</label>
                      <input type="number" class="form-control" id="recipeStars" min="0" max="5" step="1" />
                    </div>
                    <div class="col-md-12">
                      <label class="form-label">Directions</label>
                      <textarea class="form-control" id="recipeDirections" rows="5"></textarea>
                    </div>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="recipeForm" class="btn btn-primary" id="btnSaveRecipe">Save Recipe</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/lucide.min.js"></script>
    <script src="../../js/init.js"></script>

    <script>
      // Khởi chạy khi DOM sẵn sàng
      document.addEventListener('DOMContentLoaded', () => {
        // Kiểm tra quyền Admin
        const currentUserId = localStorage.getItem('CURRENT_USER_ID');
        const users = JSON.parse(localStorage.getItem('USERS') || '[]');
        const currentUser = users.find((u) => u.id === currentUserId);

        if (!currentUser || currentUser.role !== 'admin') {
          window.location.href = '/pages/login.html';
          return;
        }

        // Lưu trữ danh sách users để map tên tác giả
        let usersMap = {};

        // Tải danh sách tác giả vào select box
        function loadUsers() {
          const users = JSON.parse(localStorage.getItem('USERS') || '[]');
          const selectEl = document.getElementById('recipeAuthorId');
          if (!selectEl) return;

          selectEl.innerHTML = '';
          users.forEach((user) => {
            usersMap[user.id] = user;
            const opt = document.createElement('option');
            opt.value = user.id;
            opt.textContent = user.fullName;
            selectEl.appendChild(opt);
          });
        }

        // Render bảng danh sách công thức
        function renderTable() {
          const tbody = document.getElementById('recipesTableBody');
          const recipes = JSON.parse(localStorage.getItem('RECIPES') || '[]');
          if (!tbody) return;

          if (recipes.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No recipes found.</td></tr>';
            return;
          }

          tbody.innerHTML = recipes
            .map((recipe) => {
              const author = usersMap[recipe.authorId];
              const authorHtml = author ? `<div class="d-flex align-items-center"><img src="${author.avatar}" class="table-avatar" alt="Avatar"><span>${author.fullName}</span></div>` : '<span class="text-muted">Unknown</span>';

              return `
              <tr>
                <td><small class="text-muted">${recipe.id.substring(0, 8)}</small></td>
                <td><img src="${recipe.image}" class="table-cover" alt="Cover"></td>
                <td><div class="fw-bold">${recipe.name}</div><div class="text-muted small">${recipe.code}</div></td>
                <td>${recipe.cookTime ? recipe.cookTime + 'm' : '-'}</td>
                <td>${authorHtml}</td>
                <td class="text-end">
                  <button class="btn btn-sm btn-outline-primary me-2 btn-edit" data-id="${recipe.id}"><i data-lucide="edit"></i> Edit</button>
                  <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${recipe.id}"><i data-lucide="trash"></i> Del</button>
                </td>
              </tr>
            `;
            })
            .join('');

          if (window.lucide) window.lucide.createIcons();
        }

        // Mở modal Thêm/Sửa công thức
        function openModal(id = null) {
          const form = document.getElementById('recipeForm');
          form.reset();

          document.getElementById('recipeId').value = id || '';
          document.getElementById('recipeModalTitle').textContent = id ? 'Edit Recipe' : 'Create Recipe';

          if (id) {
            const recipes = JSON.parse(localStorage.getItem('RECIPES') || '[]');
            const r = recipes.find((recipe) => recipe.id === id);
            if (r) {
              document.getElementById('recipeCode').value = r.code;
              document.getElementById('recipeName').value = r.name;
              document.getElementById('recipeDescription').value = r.description;
              document.getElementById('recipeImage').value = r.image;
              document.getElementById('recipePrepTime').value = r.prepTime;
              document.getElementById('recipeCookTime').value = r.cookTime;
              document.getElementById('recipeCategoryId').value = r.categoryId;
              document.getElementById('recipeAuthorId').value = r.authorId;
              document.getElementById('recipeStars').value = r.stars;
              document.getElementById('recipeDirections').value = r.directions;
            }
          } else {
            if (currentUser) document.getElementById('recipeAuthorId').value = currentUser.id;
          }
          new bootstrap.Modal(document.getElementById('recipeModal')).show();
        }

        // Lưu thông tin công thức vào LocalStorage
        function saveRecipe() {
          try {
            const idInput = document.getElementById('recipeId').value;
            const id = idInput || crypto.randomUUID();

            const code = document.getElementById('recipeCode').value.trim();
            const name = document.getElementById('recipeName').value.trim();
            const description = document.getElementById('recipeDescription').value.trim();
            const image = document.getElementById('recipeImage').value.trim();
            const prepTime = document.getElementById('recipePrepTime').value;
            const cookTime = document.getElementById('recipeCookTime').value;
            const categoryId = document.getElementById('recipeCategoryId').value.trim();
            const authorId = document.getElementById('recipeAuthorId').value;
            const stars = document.getElementById('recipeStars').value;
            const directions = document.getElementById('recipeDirections').value.trim();

            // Kiểm tra các trường bắt buộc
            if (!code) return notification.error('Missing Code', 'Please enter a recipe code.');
            if (!name) return notification.error('Missing Name', 'Please enter a recipe name.');
            if (!description) return notification.error('Missing Description', 'Please enter a description.');
            if (!image) return notification.error('Missing Image', 'Please enter an image URL.');
            if (prepTime === '') return notification.error('Missing Prep Time', 'Please enter prep time.');
            if (cookTime === '') return notification.error('Missing Cook Time', 'Please enter cook time.');
            if (!categoryId) return notification.error('Missing Category', 'Please enter a category ID.');
            if (!authorId) return notification.error('Missing Author', 'Please select an author.');
            if (stars === '') return notification.error('Missing Stars', 'Please enter rating stars.');
            if (!directions) return notification.error('Missing Directions', 'Please enter directions.');

            const recipes = JSON.parse(localStorage.getItem('RECIPES') || '[]');
            const existingIndex = idInput ? recipes.findIndex((r) => r.id === idInput) : -1;
            const existing = existingIndex > -1 ? recipes[existingIndex] : null;

            if (code.length < 3) {
              return notification.error('Invalid Code', 'Recipe code must be at least 3 characters long.');
            }
            if (name.length < 5) {
              return notification.error('Invalid Name', 'Recipe name must be at least 5 characters long.');
            }

            const recipeData = {
              id,
              code: code,
              name: name,
              description: description,
              image: image,
              prepTime: parseInt(prepTime) || 0,
              cookTime: parseInt(cookTime) || 0,
              categoryId: categoryId,
              authorId: authorId,
              stars: parseInt(stars) || 0,
              directions: directions,
              ingredients: existing ? existing.ingredients : [],
              nutrition: existing ? existing.nutrition : { calories: 0, protein: 0, carbs: 0, fat: 0, cholesterol: 0 },
            };

            // Cập nhật hoặc thêm mới công thức
            if (existingIndex > -1) {
              recipes[existingIndex] = recipeData;
            } else {
              recipes.push(recipeData);
            }

            localStorage.setItem('RECIPES', JSON.stringify(recipes));

            bootstrap.Modal.getInstance(document.getElementById('recipeModal')).hide();
            renderTable();
            notification.success('Success', idInput ? 'Updated successfully' : 'Created successfully');
          } catch (error) {
            notification.error('Error', error.message);
          }
        }

        // Khởi tạo giao diện ban đầu
        loadUsers();
        renderTable();

        // Bắt sự kiện tạo mới công thức
        document.getElementById('btnCreateRecipe')?.addEventListener('click', () => openModal());

        // Bắt sự kiện submit form lưu công thức
        document.getElementById('recipeForm')?.addEventListener('submit', (event) => {
          event.preventDefault();
          saveRecipe();
        });

        // Bắt sự kiện click Sửa/Xóa trên bảng
        document.getElementById('recipesTableBody')?.addEventListener('click', (event) => {
          const editBtn = event.target.closest('.btn-edit');
          const delBtn = event.target.closest('.btn-delete');

          // Mở modal nếu bấm Edit
          if (editBtn) openModal(editBtn.dataset.id);

          // Xóa công thức nếu bấm Delete
          if (delBtn && confirm('Are you sure you want to delete this recipe?')) {
            const recipes = JSON.parse(localStorage.getItem('RECIPES') || '[]');
            const id = delBtn.dataset.id;
            const index = recipes.findIndex((r) => r.id === id);
            if (index > -1) {
              recipes.splice(index, 1);
              localStorage.setItem('RECIPES', JSON.stringify(recipes));
              renderTable();
              notification.success('Success', 'Deleted successfully');
            }
          }
        });

        // Khởi tạo các biểu tượng Lucide
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
