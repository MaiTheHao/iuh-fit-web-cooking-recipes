<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>404 - Page Not Found | Recipe4f</title>
    <style>
      .error-container {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .error-code {
        font-size: 8rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 1rem;
        color: var(--primary);
        font-family: var(--ff-serif);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="app-body">
        <div class="container error-container">
          <div class="error-code">404</div>
          <h1 class="h2 mb-4 ff-serif">Oops! Page not found</h1>
          <p class="text-muted mb-5" style="max-width: 500px">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
          <div class="d-flex gap-3">
            <a href="/html/index.html" class="btn btn-primary px-4 py-2 rounded-pill"> Back to Home </a>
            <a href="/pages/recipes.html" class="btn btn-outline-dark px-4 py-2 rounded-pill"> Browse Recipes </a>
          </div>
        </div>
      </main>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/lucide.min.js"></script>

    <script src="../js/utils/validator.js"></script>

    <script src="../js/core/domains/base.domain.js"></script>
    <script src="../js/core/domains/user.domain.js"></script>

    <script src="../js/core/services/auth.service.js"></script>

    <script src="../js/init.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
